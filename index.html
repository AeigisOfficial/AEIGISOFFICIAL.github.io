<head>

    <style>
        :root {
            --bg-color: #05070f;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-gold: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.15);
            --slate-deep: #0f172a;
            --card-bg: #0b1120;
            --border-color: #1e293b;
            --border-accent: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(30, 41, 59, 0.3) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(15, 23, 42, 0.3) 0px, transparent 50%);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            padding: 20px;
            letter-spacing: -0.01em;
        }

        .container {
            max-width: 760px;
            margin: 0 auto;
            padding: 60px 0;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
            position: relative;
        }

        .brand-crest {
            width: 80px;
            height: 90px;
            margin: 0 auto 24px auto;
            position: relative;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 2px solid var(--accent-gold);
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            box-shadow: 0 0 30px var(--gold-glow);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-crest::after {
            content: 'A';
            font-family: 'Courier New', monospace;
            font-weight: 900;
            font-size: 32px;
            color: var(--accent-gold);
            letter-spacing: 0;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-color);
            letter-spacing: 6px;
            margin-bottom: 8px;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .subtitle {
            color: var(--accent-gold);
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0.9;
            margin-bottom: 20px;
        }

        .audio-player-container {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
            border-radius: 30px;
            padding: 12px 24px;
            margin: 25px auto 0 auto;
            max-width: 280px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .audio-info {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .audio-btn {
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .audio-btn:hover {
            background: var(--accent-gold);
            color: var(--bg-color);
            box-shadow: 0 0 15px var(--gold-glow);
        }

        .manifesto-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            margin-bottom: 35px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        .manifesto-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(to bottom, var(--accent-gold), #785c18);
        }

        .manifesto-box p {
            margin-bottom: 20px;
            font-size: 1.05rem;
            color: #cbd5e1;
            text-align: justify;
        }

        .manifesto-box p:last-child {
            margin-bottom: 0;
        }

        .extended-specs {
            background-color: var(--slate-deep);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 35px;
            margin-bottom: 45px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .extended-specs h2 {
            color: var(--accent-gold);
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .extended-specs ul {
            list-style: none;
            padding-left: 0;
        }

        .extended-specs li {
            margin-bottom: 16px;
            color: #94a3b8;
            font-size: 0.95rem;
            padding-left: 20px;
            position: relative;
        }

        .extended-specs li::before {
            content: '▪';
            position: absolute;
            left: 0;
            color: var(--accent-gold);
        }

        .catalog-headline {
            text-align: center;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--accent-gold);
            margin: 40px 0 25px 0;
            font-weight: 700;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
            margin-bottom: 40px;
        }

        .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            position: relative;
            background: linear-gradient(180deg, var(--card-bg) 0%, rgba(11, 17, 32, 0.8) 100%);
        }

        .product-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 12px;
            border: 1px solid transparent;
            background: linear-gradient(180deg, var(--border-accent), transparent) border-box;
            mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            pointer-events: none;
        }

        .product-meta {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .product-title {
            font-size: 1.15rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-color);
        }

        .product-price {
            font-size: 2rem;
            color: var(--accent-gold);
            font-weight: 800;
            font-family: monospace;
        }

        .product-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 30px;
            text-align: justify;
        }

        .btn {
            display: block;
            text-align: center;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            padding: 16px 30px;
            border-radius: 6px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn:hover {
            background: var(--accent-gold);
            color: var(--bg-color);
            box-shadow: 0 0 20px var(--gold-glow);
            transform: translateY(-1px);
        }

        footer {
            text-align: center;
            color: #475569;
            font-size: 0.85rem;
            margin-top: 80px;
            border-top: 1px solid var(--border-color);
            padding-top: 30px;
        }

        footer p:first-child {
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
